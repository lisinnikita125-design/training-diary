name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Как на PythonAnywhere (пакеты пользователя стоят в python3.13).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff, pyflakes rules)
        run: ruff check

      - name: Frontend structure (div balance, glued attributes, JS syntax)
        run: python scripts/check_frontend.py

      - name: Tests
        run: pytest --cov=main --cov=database --cov=scripts --cov-report=term
